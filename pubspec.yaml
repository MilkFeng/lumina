name: lumina
description: "Lumina Reader - A lightweight, cross-platform EPUB reader built with Flutter, supporting iOS and Android systems."
publish_to: 'none'
homepage: https://github.com/MilkFeng/lumina
license: MIT

version: 0.2.5+999

environment:
  sdk: ^3.10.8
  flutter: ">=3.44.6"

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^18.0.1

  # Database
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  collection: ^1.19.1

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  # Functional Programming
  fpdart: ^1.2.0

  # EPUB Parsing
  xml: ^7.0.1
  archive: ^4.3.0
  crypto: ^3.0.7
  convert: ^3.1.2

  # Networking (external sources: WebDAV)
  http: ^1.6.0
  
  # Reader
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_widget_from_html_core: ^0.17.4
  wakelock_plus: ^1.8.0
  battery_plus: ^7.1.1

  # File Picking & Permissions
  path: ^1.9.1
  
  # App Info & URL Launcher
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0

  # Image Compression
  flutter_image_compress: 2.5.1
  saf_stream: ^4.0.1
  saf_util: ^3.1.0
  android_intent_plus: ^6.1.0
  
  # Speed Dial FAB
  flutter_speed_dial: ^7.0.0

  # File Sharing (iOS Share Sheet)
  share_plus: ^13.3.0

  # Rust FFI bridge
  flutter_rust_bridge: 2.13.0
  lumina_rust:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: ^3.0.3
  isar_community_generator: ^3.3.2
  
  # Testing
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  mockito: ^5.4.4

  # Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/icon.svg
    - assets/logos/logo.svg
    - assets/licenses/rust_licenses.json